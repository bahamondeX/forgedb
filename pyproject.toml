[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgedb"
version = "0.1.0"
description = "Lightweight SQLite ORM built on sqlite3, Pydantic v2 and Jinja2."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "jinja2>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["forgedb*"]

[tool.setuptools.package-data]
"forgedb.orm" = ["templates/*.sql.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]